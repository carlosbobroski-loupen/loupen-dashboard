      Node v26.4.0 com MODULE_NOT_FOUND enganoso (parece teste quebrado, é o runner não
      achando nada) — a forma correta é glob de arquivos.
      VERIFICADO ao escrever, não assumido: `node --test tests/js/*.test.mjs
      tests/contract/*.test.mjs` → 39/39 passando; os 3 testes de contrato passam
      individualmente; não existe package.json na raiz (CON-12 intacto).
