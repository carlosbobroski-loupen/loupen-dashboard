  - id: '6.8'
    description: >-
      Finalizar db/README.md — como aplicar migrations e executar as asserções sem tooling,
      e a convenção de arquivo de asserção
    service: infra
    files:
    - 'db/README.md'
    verification:
      type: manual
      instructions: >-
        Uma pessoa nova, só com psql e o repositório, consegue: aplicar as migrations em
        ordem, rodar a suíte de asserções e interpretar o resultado. Documentar a convenção
        de SELECT de relatório + DO/RAISE de exit code, a variável $NEON_DATABASE_URL e o
        fato de que não existe rollback automático.
    status: completed
    notes: >-
      COMPLETED (2026-09-09). db/README.md passou de 59 para ~185 linhas, cobrindo os 4
      itens que a verificação exige explicitamente:
      (a) COMO APLICAR MIGRATIONS — comandos reais, incluindo --dry-run, e as regras que
      não são óbvias: ordem lexical (por isso o prefixo numérico é obrigatório), checksum
      que RECUSA reaplicar arquivo editado (logo: nunca editar migration aplicada — criar
      nova, como fazem 041/042 corrigindo 039/040), ON_ERROR_STOP, e o fallback de PSQL_BIN
      para /opt/homebrew/opt/libpq/bin/psql (real: `psql` não está no PATH desta máquina).
      (b) COMO EXECUTAR AS ASSERÇÕES — comando individual e o loop que roda todas.
      VALIDADO DE VERDADE: copiei o loop do README e rodei; as 17 asserções passam. Também
      rodei o --dry-run documentado (exit 0, lista as 45 já aplicadas).
      (c) CONVENÇÃO DE ASSERÇÃO — as duas partes (SELECT de relatório + DO/RAISE que gera o
      exit code), e as regras que vieram de erro real cometido nesta epic: RAISE NOTICE
      obrigatório no sucesso (asserção que passa em silêncio é indistinguível de asserção
      que não rodou); mensagem nomeando o requisito; PROIBIDO o padrão
      `SELECT 1/(subquery HAVING count=N)` porque ele NÃO FALHA quando a condição é falsa
      (NULL/x = NULL, não divisão por zero) — armadilha que estava no plano original;
      testar por execução e não por leitura de código; e toda asserção que escreve limpa
      depois E verifica a limpeza, salvando/restaurando se tocar dado real (com o incidente
      do watermark de produção citado como o porquê).
      Documentada também a exceção deliberada: spike-ec7-identidade.sql MEDE custo via
      NOTICE em vez de falhar, porque nenhum requisito define alvo de performance para o
      Tier 2 — uma asserção falhando num limite inventado seria pior que nenhuma.
      (d) AUSÊNCIA DE ROLLBACK — seção própria: forward-only significa sem down migration e
      sem revert; cada arquivo roda em transação (protege contra falha no meio, não contra
      arrependimento depois); desfazer exige migration inversa nova; mudança destrutiva
      testa em branch do Neon primeiro (o mecanismo de segurança disponível no lugar do
      rollback que não existe); e a role crm_ingest não tem DDL/DROP/TRUNCATE de propósito
      (INV-1), então nenhum workflow de ingestão pode causar dano estrutural.
      (e) SEM TOOLING (CON-12) — seção explicando que tudo roda colando no console SQL do
      Neon ou em qualquer cliente Postgres, e o que se perde ao fazer à mão (o registro em
      schema_migrations/checksum, e o exit code das asserções — no console o sinal
      equivalente é o NOTICE de sucesso ou o ERROR nomeando o requisito).
    dependencies: ['3.12', '2.20']
    stage: B
  - id: '6.9'
    description: >-
      Verificar NFR-6 por revisão de schema — acrescentar um canal de anúncio novo em
      ambiente de teste e provar que nenhuma coluna do schema central mudou
    service: database
    files:
    - 'db/queries/verificacao/nfr6-novo-canal.sql'
    verification:
      type: command
      command: 'psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/queries/verificacao/nfr6-novo-canal.sql'
    status: completed
    notes: >-
      COMPLETED (2026-09-09). db/queries/verificacao/nfr6-novo-canal.sql roda e passa.
      Implementado como PROVA POR EXECUÇÃO, não revisão visual de schema: tira uma
      impressão digital md5 de todas as colunas do schema central (lead/opportunity/
      campaign/contact/account/ad_campaign — 70 colunas, fingerprint
      a829b6c8fd4edc0a09cbb22e558d270e), ingere um canal INÉDITO (`tiktok_ads`) pelo MESMO
      caminho dos canais reais (stg_ads → fn_run_ingest_batch → ad_campaign), reconfere a
      impressão digital, e limpa o dado de teste (limpeza verificada: 0 resíduo, e as 33
      campanhas reais de 2.18 intactas).
      As métricas do canal de teste são deliberadamente de forma DIFERENTE dos 3 canais
      reais (`video_views`/`saves`, que nenhum deles tem) — é justamente isso que exigiria
      coluna nova se o desenho fosse rígido. Se acrescentar um canal exigisse ALTER TABLE,
      o arquivo FALHARIA (o insert quebraria por coluna faltando) em vez de passar
      silenciosamente.
      Razão de fundo pela qual funciona: ad_campaign.metricas é jsonb, então a diferença de
      forma entre plataformas é absorvida em DADO, não em DDL. Evidência independente e
      anterior a esta asserção: os 3 canais reais de 2.18 (Meta/Google/LinkedIn) foram
      ingeridos pela primeira vez sem nenhuma migration de schema.
      DESVIO DELIBERADO da nota original: ela pedia inserir também em `channel_source`.
      Não foi feito — channel_source é catálogo de CANAL DE ORIGEM DE LEAD (ads/formulario/
      outbound/...), com CHECK restrito a Marketing/Comercial/NaoAtribuido; não é o
      catálogo de plataformas de anúncio. Inserir um canal de anúncio ali seria confundir
      duas dimensões distintas. ad_campaign é a tabela correta (DM-6) e é onde a prova roda.
    dependencies: ['2.5', '3.5']
