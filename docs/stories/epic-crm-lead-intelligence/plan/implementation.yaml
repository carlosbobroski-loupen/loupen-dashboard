      (3) CUSTO DO TIER 2 — ACHADO INESPERADO: o índice GIN idx_lead_nome_trgm (criado na
      migration 004 explicitamente "para tornar similarity() sobre nome executável em
      escala") NÃO É USADO pelo desenho atual. Provado por EXPLAIN (ANALYZE) sobre amostra
      de 20.000 leads x 5.000 contatos: com o filtro de igualdade de domínio de e-mail
      presente, o planner escolhe Merge Join pelo domínio e aplica `nome % nome` como Join
      Filter pós-join — o Bitmap Index Scan sobre o trigram só aparece quando se REMOVE o
      filtro de domínio, o que muda a semântica (1,4M pares vs 57,5k). Medições: set-based
      com filtro 393ms; operador % com filtro 353ms (mesmo resultado, custo igual → índice
      não contribui); loop PL/pgSQL atual da função 488ms; operador % sem filtro 131ms mas
      semântica diferente. Razão de fundo: o filtro de domínio já é altamente seletivo e
      faz a poda pesada antes; o trigram não tem o que acrescentar.
      DECISÃO: 3.11 NÃO muda de estratégia — o gatilho previsto nesta nota ("se o custo for
      proibitivo") não ocorreu. 488ms para 20k x 5k é aceitável para um job periódico de
      reconciliação (NFR-2 é sobre a API de leitura, não sobre este job). O índice ficou
      como peso morto para este caso de uso — não é bug (não quebra nada), e dropar o
      índice ou reescrever a função em forma set-based (ganho de ~20%) fica REGISTRADO como
      opção, NÃO executado: nenhuma das duas é necessária e mexer nisso agora seria
      otimização prematura.
      A amostra é sintética de propósito (a base real tem 13 leads e 6 contatos — pequena
      demais para o planner considerar índice); nomes sintéticos só geram trigramas
      realistas, nenhum número de negócio deriva deles, e as tabelas são TEMP.
