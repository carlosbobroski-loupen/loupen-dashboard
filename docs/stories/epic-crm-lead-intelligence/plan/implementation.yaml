# Implementation Plan — CRM Lead Intelligence
# Gerado na Fase 6 (plan) do Spec Pipeline AIOX por @architect (Aria)
# Fonte primária: docs/stories/epic-crm-lead-intelligence/spec/spec.md (iteração 2.1, §3, §5, §9)
# Fontes secundárias: complexity.json (COMPLEX 24/25), critique-2.json (carryForwardToPlan)
#
# REVISÃO 2026-09-04 (patch mecânico, aplicado pelo orquestrador, sem nova rodada de
# critique/plan): usuário pediu foco em Salesforce (leads/oportunidades), RD Station e
# anúncios pagos, tirando SDR IA/WhatsApp e o painel de MDFs do escopo imediato, visando
# velocidade. Impacto real, verificado subtask a subtask: (a) MDFs nunca apareceu em
# requirements.json nem neste plano — nada mudou; (b) SDR IA tinha 1 subtask própria
# (2.19, ingestão WhatsApp) — REMOVIDA, e a dependência órfã em 2.20 foi corrigida;
# (c) 3.10/3.14/5.14 permanecem — cobrem identidade/atribuição/frescor de forma geral,
# não são exclusivas de WhatsApp. FR-12/CON-5/EC-4 ficam DEFERRED (não removidos) em
# requirements.json e spec.md §1.3 (NG9). Total de subtasks: 100 → 99. A redução de
# esforço é MARGINAL (~1 subtask de 100) — o grosso da estimativa de 12-18 dias vem do
# schema/identidade/atribuição/gate/superfície, que não encolhem com este corte.
#
# ═════════════════════════════════════════════════════════════════════════════
# REVISÃO 2 — 2026-09-04 (INVERSÃO DE SEQUENCIAMENTO: frontend antes do backend)
# Decisão de produto do usuário, reavaliada tecnicamente por @architect (Aria).
# ═════════════════════════════════════════════════════════════════════════════
#
# O QUE MUDOU. A ordem original deste plano (banco → backend → frontend → integração)
# vinha da regra de dependência do task file e do achado de research.json
# (researchByPerspective.2_marketing_revops): "Customer 360 é a SAÍDA da resolução de
# identidade, não uma tela", que estabelece que FR-2/FR-3 não são CONSTRUÍVEIS antes de
# EC-7. O usuário pediu para construir TODA a superfície primeiro, contra dados curados
# manualmente das planilhas que já alimentam o dashboard, liberando o backend depois.
#
# VEREDITO ARQUITETURAL: VIÁVEL COM RESSALVAS. Não refuto o achado do research — refino o
# que ele proíbe. O achado diz que o Customer 360 é a SAÍDA da resolução de identidade.
# Isso torna impossível PRODUZIR a ficha em escala sem EC-7; NÃO torna impossível
# RENDERIZAR a forma da saída para uma amostra costurada à mão. A inversão separa duas
# coisas que o plano original tratava como uma: (a) a forma do dado 360 (contratável e
# renderizável agora) e (b) o motor que a produz para centenas de leads (segue sendo
# trabalho de backend, nada eliminado). O limite dessa separação está registrado em R25:
# costura manual é 100% precisa por construção, então o estado MAIS DIFÍCIL de EC-7
# (ambiguidade: vínculo provável, conflito) não recebe nenhuma validação de UX a menos que
# seja SEMEADO deliberadamente no fixture — que é por isso que 0.4 é subtask de @dev
# separada da curadoria humana de 0.5, e por que o validador de 0.3 exige a presença de
# cada estado de borda.
#
# O QUE HABILITA A INVERSÃO: a costura já estava no spec. §5.1 define
# assets/js/data-api.js como a "camada ÚNICA de acesso a dados" e P-UI-5 a chama de
# "embrião da mitigação M1". A inversão não inventa uma camada de abstração — ela ANTECIPA
# uma que o spec já exigia por outro motivo (autorização da fase 2). O contrato de dados
# formalizado em phase-0 é a mesma costura, tornada verificável por máquina.
#
# LASTRO DOS DELIVERABLES NOVOS (Artigo IV — No Invention). phase-0 cria quatro classes de
# artefato. Nenhuma é invenção:
#  (a) docs/architecture/data-contract.md + schemas — mesma classe de
#      docs/architecture/edge-routing.md e adr-*.md, ambos deliverables de §5.1. O CONTEÚDO
#      deriva integralmente de requirements.json.domainModel (DM-1..DM-12),
#      research.json.attributionModelProposal (taxonomia, S1-S6, P1-P7),
#      requirements.json.interactions (INT-1..INT-6) e dos AC de §2.1. NENHUM campo novo
#      sem lastro; onde um campo existe só para a Etapa B (ex.: ruleset_version), ele entra
#      NULLABLE desde o mock, para que a Etapa B não mude a forma.
#  (b) tests/contract/** — validador em `node --test`, o runner já escolhido por ADR-017
#      (5.6). Zero dependência instalada, zero package.json, zero build (CON-10, CON-12).
#      PROIBIDO usar ajv/zod/qualquer validador de schema em npm — seria package.json.
#  (c) assets/data/mock/*.json — o fixture. É o substituto temporário dos arrays embutidos
#      que FR-7 existe para eliminar; vive em arquivo separado e ANONIMIZADO (ver R23).
#  (d) ADR-020/ADR-021 — registro desta própria decisão, exigido por FR-14/AC-14.1.
#
# CUSTO HONESTO: a inversão NÃO reduz os 12-18 dias. Ela REORGANIZA e CRESCE o total
# (estimativa revisada abaixo), porque acrescenta (1) a formalização do contrato,
# (2) um filtro/paginação em JS descartável que espelha fn_search_leads e será deletado no
# cutover, (3) a validação do contrato DUAS vezes (mock e real) e (4) um segundo passe na
# superfície quando o dado real revelar forma que o mock não tinha. Acrescenta também
# 1,5-2,5 dias de trabalho HUMANO de curadoria que não existia no plano original.
#
# GANHOS REAIS (não só velocidade percebida), registrados para não parecerem racionalização:
#  - R13 ALIVIADO: a decomposição do artefato de 5.014 linhas (5.2-5.5) passa a acontecer
#    PRIMEIRO. No plano original, phases 2-4 rodavam inteiras com o monolito intacto e toda
#    a superfície aterrissava nele por último.
#  - O fixture curado é um substrato DETERMINÍSTICO para os specs Playwright de 5.16. No
#    plano original eles rodariam contra base viva, que muda a cada ingestão — teste flaky
#    por construção. O mock vira fixture permanente e a MESMA suíte roda contra o real.
#  - A curadoria força OQ-13 (vocabulário de outbound) e OQ-12 (Parceiro/Indicação) a serem
#    respondidos ANTES e mais barato, porque 0.5 exige que o curador registre o sinal_id
#    (S1-S6) de cada lead em vez de só o rótulo. Isso é V3/V4 antecipados de graça.
#
# O QUE PIORA, sem eufemismo:
#  - R14 AGRAVADO: a cirurgia de maior risco do épico (5.2/5.3 no index.html, que É o
#    produto em produção, scope 5/5 risk 5/5) passa a ocorrer ANTES de existir a suíte SQL
#    versionada — que é a única mitigação de R14. Compensação parcial: a rede daquela
#    cirurgia específica nunca foi a suíte SQL, e sim o screenshot comparativo (5.2), o
#    console limpo (5.3) e o git; essas três são nativas da Etapa A.
#  - NFR-2 descoberto por último: que a cadeia navegador → Cloudflare → n8n → Neon caiba em
#    2-3 s é DERIVAÇÃO do spec, não medição (§4.4). Um JSON estático em CDN será instantâneo,
#    então a Etapa A cria uma expectativa de responsividade que a Etapa B pode não cumprir —
#    o usuário sentiria o cutover como REGRESSÃO. Mitigado por 1.16 (sonda de latência da
#    cadeia completa na Etapa A, sem precisar de schema).
#  - A Etapa A NÃO valida o defeito que originou a epic. FR-8/NFR-1/INV-2 (44 de 236 linhas,
#    totais hardcoded) só são corrigíveis com ingestão real. Um mock curado É, por
#    definição, um snapshot feito à mão. A Etapa A valida EXPERIÊNCIA, não INTEGRIDADE.
#  - R22 (novo) ANCORAGEM e R23 (novo) PII EM REPOSITÓRIO PÚBLICO — ver o bloco `stages`.
#
# COMO A REVISÃO FOI APLICADA (deliberadamente conservadora):
#  - NENHUM id de phase ou de subtask existente foi renumerado, e NENHUMA subtask foi
#    removida. Renumerar 99 subtasks quebraria as dependências, as referências em prosa
#    ("ver 2.13"), os ADR-015..019 e a rastreabilidade com o spec e o critique.
#  - A etapa de cada subtask é declarada por campo `stage: A | B`. Precedente de schema:
#    o próprio task file (plan-create-implementation.md, Step 6.5) acrescenta o campo
#    `codeIntelligence` a subtasks; o schema draft-07 de subtask não tem
#    additionalProperties:false. `stage` é campo válido, não desvio.
#  - Fases de etapa única declaram a etapa na `description`; fases MISTAS (phase-1,
#    phase-5, phase-6) declaram `stage` subtask a subtask.
#  - ORDEM DE ARQUIVO ≠ ORDEM DE EXECUÇÃO, e isso já era verdade neste plano antes desta
#    revisão (convenção 6 original: phase-4 podia rodar em paralelo com phase-2/3). Os ids
#    de fase seguem sequenciais em ordem de arquivo (phase-0..phase-7) para satisfazer o
#    quality check "Phase IDs are sequential" do task file; a ordem real está em
#    `executionOrder` e nas `dependencies`, que são o mecanismo de ordenação do schema.
#
# ─────────────────────────────────────────────────────────────────────────────
# CONVENÇÕES DESTE PLANO (leia antes de executar)
# ─────────────────────────────────────────────────────────────────────────────
# 1. storyId: o schema de implementation.yaml exige o padrão ^[A-Z]+-\d+$|^story-\d+...
#    Este épico usa "epic-crm-lead-intelligence" em TODOS os artefatos do pipeline
#    (requirements/complexity/research/spec/critique). DESVIO DECLARADO, não acidente:
#    o padrão do schema não acomoda IDs de épico. Mantido o ID real para preservar
#    rastreabilidade (FR-14/AC-14.2).
#
# 2. PSEUDO-PATHS para configuração fora do repositório. n8n e Cloudflare são
#    configuração de painel, não código versionado (§5.2). Subtasks de infra usam
#    URIs explícitas — n8n://workflow/<slug>, cloudflare://zone/<host>/<recurso>,
#    github://repo/settings/pages — SEMPRE acompanhadas, quando aplicável, do arquivo
#    real do repositório onde a configuração é documentada (docs/architecture/edge-routing.md).
#    O spec removeu por Artigo IV a ideia de versionar JSON de workflow n8n; este plano
#    NÃO a reintroduz — documenta a configuração em prosa, como já faz para as regras de borda.
#
# 3. VERIFICAÇÃO. CON-12 proíbe build step: não existe package.json da aplicação,
#    portanto NENHUMA subtask usa `npm run build`/`npm run typecheck`.
#      - database  → type: command com psql (assertion files usam DO/RAISE, ver 2.2)
#      - infra     → type: manual (painel) ou command com curl
#      - frontend  → type: browser (Playwright via npx, sob demanda) ou manual
#      - JS puro   → type: command com `node --test` (runner nativo do Node 18+,
#                    zero dependência, zero build — ver ADR-017 / subtask 5.6)
#
# 4. $NEON_DATABASE_URL = connection string do endpoint `-pooler` com sslmode=require
#    (P-ING-6). Convenção registrada em db/README.md (subtask 2.1).
#
# 5. Fase 0 do spec (§9) virou phase-1 deste plano por instrução do orquestrador.
#    Ela contém as validações que podem INVALIDAR decisões (R1/R2/R4). Cada subtask
#    de phase-1 declara em `notes` o que fazer se falhar. Nenhuma subtask de
#    implementação (phase-2+) deve começar antes das dependências de phase-1 que a cobrem.
#
# 6. PARALELISMO: phase-4 (gate de acesso) não depende de phase-2 nem de phase-3 —
#    só de phase-1. Pode rodar em paralelo com phase-2/phase-3.
#    ALTERADO NA REVISÃO 2: phase-5 (superfície) NÃO depende mais de phase-2/3/4 na Etapa A
#    — depende de phase-0 (contrato + fixture). As subtasks de phase-5 que genuinamente
#    exigem backend real (5.12, 5.13, 5.17, 5.18) estão marcadas `stage: B` e executam
#    junto de phase-7. Ver `stages` e `executionOrder`.
#
# 7. DECISÕES TOMADAS NESTA FASE (carryForwardToPlan do critique-2), formalizadas
#    como ADR-015..ADR-019 em phase-6:
#      D15 mecânica de invocação da função SQL pelo n8n → staging + 1 procedure por lote (2.13, 3.9)
#      D16 DDL do versionamento de reclassificação exigido por I4 → append-only efetivo-datado (2.10)
#      D17 runner dos casos não expressáveis em SQL → node --test + Playwright via npx (5.6, 5.16)
#      D18 confirmação da unidade de estrangulamento = fonte de dados por view (§3.7)
#      D19 filtragem combinável resolvida em SQL server-side, não em JS no cliente (3.19)
#
# 8. ETAPAS (revisão 2). Todo subtask de fase MISTA carrega `stage: A` ou `stage: B`.
#    Fases de etapa única declaram na `description`. Regra de leitura para o executor:
#    NUNCA execute uma subtask `stage: B` durante a Etapa A, mesmo que suas dependências
#    estejam satisfeitas — a fronteira das etapas é o gate 7.4 (CON-8), não o grafo de
#    dependências. O inverso é permitido: subtask `stage: A` pendente pode ser executada
#    durante a Etapa B.
#
# 9. D20/D21 — DECISÕES DA REVISÃO 2, formalizadas como ADR-020/ADR-021 em 0.6:
#      D20 sequenciamento invertido: superfície contra fixture curado antes do backend real
#      D21 contrato de dados congelado e verificável por máquina como a costura A↔B,
#          materializado na camada única data-api.js que §5.1/P-UI-5 já exigiam

storyId: 'epic-crm-lead-intelligence'
createdAt: '2026-09-04T00:00:00Z'
createdBy: '@architect'
status: pending
complexity: COMPLEX
estimatedEffort: |
  REVISADO NA REVISAO 2 (inversao de sequenciamento) — a inversao NAO reduz o total, REORGANIZA e CRESCE ligeiramente (formalizacao de contrato, dupla validacao mock+real, 1,5-2,5 dias de curadoria humana). Etapa A (phase-0 + phase-5 stage:A): ~1-2 dias de phase-0 (contrato+fixture, incl. curadoria humana) + ~3-4 dias de phase-5 stage:A (14 de 19 subtasks) = ~4-6 dias uteis, ENTREGA VISUAL RAPIDA, valida EXPERIENCIA, nao INTEGRIDADE (FR-8/NFR-1 continuam sem correcao real ate a Etapa B). Etapa B (phase-1 stage:B + phase-2 + phase-3 + phase-4 + phase-5 stage:B + phase-6 + phase-7): phase-1 ~1 dia, phase-2 ~4-5 dias, phase-3 ~3-4 dias, phase-4 ~1-2 dias, phase-5 stage:B (5 de 19 subtasks) ~1-2 dias, phase-6 ~1-2 dias, phase-7 (cutover) ~0.5-1 dia = ~11-16 dias uteis. TOTAL ~15-22 dias uteis (contra 12-18 do plano original) — o aumento e o custo honesto da dupla validacao e da curadoria, nao um erro de estimativa anterior. NAO inclui espera humana em pontos de decisao (CON-8: 7.4; OQ-8 bloqueia phase-2). Fase 2 do produto (NFR-3 completo, Next.js, RLS) segue fora deste plano por §3.8.

dependencies:
- name: 'Neon Free (Postgres serverless)'
  version: 'plano Free — região aws-sa-east-1 (São Paulo), major do PG fixada em 2.1'
  purpose: 'Base consolidada, domicílio do motor de atribuição e das regras de receita (CON-15, D2)'
- name: 'pg_trgm'
  version: '1.6 (nativo do Postgres)'
  purpose: 'Tier 2 da resolução de identidade — similarity() de nome (EC-7, T2.1). Premissa validada em 1.1'
- name: 'fuzzystrmatch'
  version: '1.1-1.2 (nativo do Postgres)'
  purpose: 'Tier 2 — levenshtein/metaphone (EC-7, T2.2). Premissa validada em 1.1'
- name: 'n8n (self-hosted, n8n.loupenapps.com.br)'
  version: 'versão em produção — inventariada em 1.11'
  purpose: 'REUSE (CON-9/ASM-3): 100% da ingestão e também a camada de leitura /api/* (D4, D5)'
- name: 'Cloudflare Free (DNS, proxy, Universal SSL, Zero Trust Access, Origin Rules, Transform Rules)'
  version: 'plano Free'
  purpose: 'Gate binário por domínio de e-mail + API same-origin (D7, D9, D10)'
- name: 'GitHub Pages'
  version: 'em uso, branch main, path /'
  purpose: 'REUSE — hospedagem do artefato vanilla (CON-12, D6)'
- name: 'psql (cliente PostgreSQL)'
  version: '>= 14'
  purpose: 'Aplicar migrations e executar as asserções SQL. Ferramenta de máquina de dev, NÃO dependência da aplicação (CON-12)'
- name: 'Node.js runner nativo (node --test)'
  version: '>= 18 (já exigido pelo projeto)'
  purpose: 'Único runner dos testes de JS puro (url-state). Zero dependência instalada, zero build step (ADR-017)'
- name: 'Playwright'
  version: 'invocado por npx sob demanda — NÃO commitado como dependência'
  purpose: 'Cenários de aceite §6.3 e verificações browser. Nunca entra em package.json da aplicação (CON-12, ADR-017)'
- name: 'NENHUM pacote npm da aplicação'
  version: 'n/a'
  purpose: 'CON-10 (custo zero) + CON-12 (sem build step). Zustand/React Query/Tailwind/Next.js estão DEFERRED por §3.8, não disponíveis nesta fase'

phases:
  # ═══════════════════════════════════════════════════════════════════════════
- id: phase-0
  name: Fase A.0 — Contrato de dados e fixture curado (pré-requisito da Etapa A)
  description: 'Formaliza o contrato de dados que assets/js/data-api.js (5.4) vai consumir, e produz o fixture curado que substitui o backend real durante a Etapa A. Nasce da REVISAO 2 (inversao de sequenciamento) e do achado de research.json de que Customer 360 e a SAIDA da resolucao de identidade — aqui essa saida e costurada a mao para uma amostra, nao computada em escala (isso continua sendo phase-2/phase-3). Nenhuma subtask desta fase depende de phase-1..phase-4: e o unico ponto de entrada da Etapa A.'
  subtasks:
  - id: '0.1'
    description: |
      Formalizar o contrato de dados em docs/architecture/data-contract.md: forma exata de GET /api/leads (lista + filtros combinaveis por interseccao), GET /api/leads/{id} (ficha em tres blocos Overview/Activity/Related), o objeto ConversionEvent da jornada e a estrutura da razao de atribuicao (sinal, confianca, campos brutos preservados). Derivado de requirements.json.domainModel (DM-1..DM-12), research.json.attributionModelProposal (taxonomia, S1-S6, P1-P7), requirements.json.interactions (INT-1..INT-6) e dos AC de FR-1/FR-2/FR-3/FR-4/FR-5/FR-6. NENHUM campo sem lastro nesses tres artefatos; onde um campo so existe para a Etapa B (ex.: ruleset_version), ele entra como NULLABLE ja no contrato, para que o cutover (7.1) nao mude a forma.
    service: infra
    files:
    - docs/architecture/data-contract.md
    - docs/architecture/schemas/lead.schema.json
    verification:
      type: manual
      instructions: Revisar o contrato campo a campo contra domainModel/attributionModelProposal/interactions de requirements.json e research.json; nenhum campo deve ficar sem uma dessas fontes citada.
    status: completed
    notes: |
      ADR-021 (6.?? nao — registrado em 0.6) documenta esta costura. E a mesma classe de deliverable que docs/architecture/edge-routing.md (ja previsto em §5.1 do spec) — nao e invencao de processo novo.
  - id: '0.2'
    description: |
      Criar o esqueleto do fixture em assets/data/mock/*.json seguindo o contrato de 0.1 — estrutura vazia/minima (arrays e objetos no formato certo, sem conteudo real ainda), para que a curadoria humana (0.5) e a semeadura de casos dificeis (0.4) preencham o mesmo molde.
    service: frontend
    files:
    - assets/data/mock/leads.json
    - assets/data/mock/leads-detalhe.json
    verification:
      type: command
      command: node --test tests/contract/fixture-shape.test.mjs
    status: completed
    dependencies:
    - '0.1'
  - id: '0.5'
    description: |
      CURADORIA HUMANA (nao e subtask de codigo — responsabilidade do usuario/time, nao do @dev): extrair ~6-10 registros reais das planilhas que ja alimentam o dashboard (Central de Leads e equivalentes) e preencher o fixture de 0.2 com dados no formato do contrato, cobrindo os tres segmentos (Marketing/Comercial/Nao atribuido) e ao menos um sinal de cada familia S1-S6. Para CADA lead, registrar explicitamente qual sinal (S1..S6) о justifica — nao so o rotulo final. ATENCAO A R23: os dados devem ser anonimizados/ficticios na forma final do arquivo (nomes/telefones de exemplo, nunca PII real), porque este artefato vai para o mesmo repositorio publico que teve o incidente de exposicao ja remediado — nunca reintroduzir o mesmo erro.
    service: infra
    files:
    - assets/data/mock/leads.json
    verification:
      type: manual
      instructions: 'Usuario confirma, registro a registro: (a) dado vem de fonte real mas foi anonimizado antes de salvar; (b) o sinal_id (S1-S6) de cada lead esta anotado; (c) os tres segmentos estao representados.'
    status: completed
    dependencies:
    - '0.2'
    notes: |
      DESVIO DE PROCESSO REGISTRADO: esta subtask foi desenhada como curadoria humana, mas o usuário pediu explicitamente, em 2026-09-07, que o orquestrador consultasse Salesforce/RD Station diretamente e preenchesse os leads reais, para aprovação posterior. 7 leads reais extraídos via SOQL (5 marketing, 1 comercial, 1 nao_atribuido), anonimizados (nome/empresa/e-mail/telefone ficticios; segmento, sinal, estagio, MRR/estagio de oportunidade e codigo de campanha mantidos reais). RD Station consultado mas sem correspondencia de campanha/LP para estes leads especificos. PENDENTE: aprovacao explicita do usuario antes de prosseguir para 0.4 (semeadura de casos dificeis).
  - id: '0.4'
    description: |
      Semeadura deliberada dos estados de borda mais dificeis de EC-7 que a curadoria humana sozinha nao produz naturalmente: um par de leads com vinculo de identidade PROVAVEL (confidence < 1, Tier 2), um conflito (mesmo e-mail, telefones e nomes divergentes), um lead sem nenhuma conta/oportunidade vinculada, e uma fonte marcada indisponivel com idade do dado declarada (nunca zero). Subtask de @dev, separada da curadoria humana porque exige conhecer o desenho de identity_edge/identity_candidate do spec (§3.3) para fabricar o caso corretamente.
    service: frontend
    files:
    - assets/data/mock/leads.json
    verification:
      type: command
      command: node --test tests/contract/edge-cases-presentes.test.mjs
    status: completed
    dependencies:
    - '0.5'
    notes: |
      Semeados 6 leads sinteticos: par de identidade PROVAVEL (seed-prov-01/02), par em CONFLITO (seed-conf-01/02), fonte indisponivel com idade declarada (seed-src-01), e um exemplo do sinal S2 que nao apareceu na amostra real consultada (seed-s2-01). Schema estendido com campo vinculo_identidade (nullable) para suportar EC-7 Tier 2 — ADR-021 atualizado por referencia. tests/contract/edge-cases-presentes.test.mjs: 7/7 passando.
  - id: '0.3'
    description: |
      Validador que confirma, por maquina, que o fixture cobre cada estado de borda exigido (vazio, erro, provavel/conflito de identidade, sem oportunidade, fonte indisponivel) ANTES de qualquer subtask de phase-5 poder consumir o fixture. Roda por node --test (ADR-017/5.6), zero dependencia instalada. PROIBIDO usar ajv/zod/qualquer validador de schema via npm — introduziria package.json e violaria CON-10/CON-12.
    service: frontend
    files:
    - tests/contract/fixture-coverage.test.mjs
