      mais caro de manter, sem bundler nem tipos; (d) INV-2: o agregado tem de vir do banco
      com a divergência declarada, e calcular KPI no cliente reabre o caminho do total
      hardcoded.
      Trade-off aceito: mais superfície SQL e um round trip por mudança de filtro. Mitigado
      pelo alvo generoso de NFR-2 e pelos índices de 2.14/6.11.
      AC-1.1 é normativo: filtros combinados produzem INTERSEÇÃO, nunca substituição.
      A função também retorna a contagem total e o resumo dos filtros ativos, porque
      INT-1/P-UI-6 exige estado vazio com resumo dos filtros em vez de zero sem contexto.
    dependencies: ['3.17', '2.14']

  # ═══════════════════════════════════════════════════════════════════════════
- id: phase-4
  name: 'Fase 1c — Gate de acesso (Cloudflare Access, Origin Rules, Transform Rules)'
  description: >-
    Configuração de painel, não código (§5.2). Depende apenas de phase-1 (validações
    UC-2/UC-3/UC-5/UC-6/UC-9 e da decisão OQ-15/OQ-16), portanto RODA EM PARALELO com
    phase-2 e phase-3. Ordem interna é a de §3.4, que não é arbitrária: DNS antes de
    Pages, Pages antes de Access, Access antes das regras de /api/*. Verificação é
    manual/curl com os critérios de aceite que o spec já escreveu — nada aqui é
    testável por suíte automatizada.
  subtasks:
  - id: '4.1'
    description: >-
      Criar ou confirmar a zona proxiada na Cloudflare para o hostname decidido em OQ-15 e
      criar o CNAME para carlosbobroski-loupen.github.io com proxy LIGADO
    service: infra
    files:
    - 'cloudflare://zone/dns'
    - 'docs/architecture/edge-routing.md'
    verification:
      type: command
      command: 'dig +short <hostname-oq15> | head -3 && curl -sS -o /dev/null -D - "https://<hostname-oq15>/" | grep -i "^server:"'
    status: superseded
    notes: >-
      SUPERADA (2026-09-09) por ADR-018 — não foi feita e não deve ser feita. O usuário
      confirmou que não conseguirá acesso à conta Cloudflare que administra
      loupenapps.com.br/loupen.com.br. O desenho novo (Cloudflare Pages + Access em conta
      NOVA, hostname gratuito *.pages.dev) dispensa zona, DNS e domínio por completo, e
      *.pages.dev já é servido proxiado pela Cloudflare por natureza — não há CNAME nem
      proxy a configurar. Substituída por 4.14/4.15/4.16.
      Mantida no plano em vez de apagada, pela mesma convenção da inversão de
      sequenciamento: nenhum id é renumerado nem removido, para o histórico da decisão
      permanecer auditável.
      NOTA ORIGINAL PRESERVADA: Proxy LIGADO é requisito TANTO do Access QUANTO das Origin
      Rules — sem ele, nada de phase-4 funciona. PR-3 (inventário DNS de 1.2) tem de estar feito: mexer em
      nameserver sem inventariar MX é o caminho para derrubar o e-mail corporativo (R3).
      Preferir dashboard.loupenapps.com.br, a zona onde o n8n já vive: coloca dashboard e
      API na mesma zona e mantém o domínio institucional fora do caminho crítico.
      O header `server: cloudflare` na resposta é a evidência de que o proxy está ativo.
    dependencies: ['1.2', '1.14']
  - id: '4.2'
    description: 'Configurar SSL/TLS = Full na zona (nem Strict, nem Flexible)'
