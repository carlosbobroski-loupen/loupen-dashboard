    notes: >-
      [AUTO-DECISION — ADR-016] carryForwardToPlan pedia "o DDL da estrutura de
      versionamento de reclassificação exigida por I4". Decisão:
      lead_origin_classification(id, lead_id, version, segmento, categoria, detalhe,
      campanha_id, sinal_id, valor_bruto, razao jsonb NOT NULL, is_first_touch,
      ruleset_version FK, classified_at, classified_by, supersedes_id FK self,
      reclass_reason, valid_from, valid_to) + índice único parcial em (lead_id) WHERE
      valid_to IS NULL + UNIQUE(lead_id, version).
      Três invariantes NO BANCO, não na aplicação:
      (a) trigger BEFORE UPDATE que RAISE a menos que a única coluna alterada seja valid_to
          → I4: reclassificação é INSERT de nova versão, nunca UPDATE do histórico;
      (b) trigger que RAISE em INSERT de segunda linha com is_first_touch=true por lead
          → I3: first-touch gravado uma vez e nunca sobrescrito por reingestão;
      (c) CHECK (classified_by LIKE 'reclass:%' IMPLICA reclass_reason IS NOT NULL)
          → reclassificação sem razão é impossível de gravar.
      attribution_ruleset(version, definition_hash, migration_file, activated_at) liga
      cada classificação à versão da regra que a produziu — sem isso, a matriz de transição
      de V1 não é reproduzível.
      Escolhi efetivo-datado append-only em vez de coluna de versão simples ou tabela de
      log lateral porque só ele responde às três perguntas de I4 simultaneamente
      (quem, quando, de-para) e ainda permite ler o estado corrente em uma query barata
      pelo índice parcial. Trade-off: escrita mais cara e joins com filtro valid_to IS NULL
      em toda leitura — mitigado pelo índice parcial e pela ordem de centenas/milhares de
      leads (NFR-2, não é volume de big data).
      A verificação acima prova o trigger na prática: um UPDATE no histórico TEM de falhar.
      A asserção completa i3-i4.sql é escrita em 3.4, quando a função de atribuição já tem
      contrato para ser testada contra — aqui o alvo é o DDL, não a regra.

      CONCLUÍDA (2026-09-07). `008_attribution_classification_versioned.sql` +
      `009_attribution_append_only_triggers.sql` aplicados. Como a tabela nasce vazia, criei
      um lead+classificação de teste para exercitar de verdade os 3 invariantes, depois
      removi ambos: (1) verificação oficial (UPDATE arbitrário) → exit 0, trigger bloqueou
      genuinamente; (2) UPDATE só de valid_to (fechar versão) → funciona, como deve;
      (3) segunda linha is_first_touch=true pro mesmo lead → `ERROR: I3 violado`, exit 1.
      Os três invariantes são reais no banco, não só declarados no DDL.
    dependencies: ['2.4']
