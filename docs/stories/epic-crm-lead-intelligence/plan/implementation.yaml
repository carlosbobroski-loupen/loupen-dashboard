      Contexto obrigatório do ADR-018: CON-6 (index.html estático em produção, sem backend e
      sem banco) faz disto uma MIGRAÇÃO BROWNFIELD, não um greenfield — complexity.json
      exige do Plan uma estratégia explícita de coexistência e corte (EC-12, OQ-10), e é
      exatamente essa estratégia que este ADR registra.
      ADR-018 fecha formalmente a pendência que §3.7 encaminhou ao @architect na Fase 6:
      CONFIRMO que, na fase 1, a unidade de estrangulamento é a FONTE DE DADOS DE CADA VIEW,
      não a view em um app novo. Razões acrescentadas por mim ao lastro do spec: (a) CON-12
      exclui um segundo app; (b) migrar a fonte de dados de uma view é REVERSÍVEL (volta ao
