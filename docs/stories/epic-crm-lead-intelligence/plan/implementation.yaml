      desta procedure é POR LOTE, não a reconciliação TOTAL origem↔destino do EC-6 (essa é
      responsabilidade do workflow n8n em 2.16/2.17/2.18, que consulta o total real na
      origem — não cabe numa procedure de assinatura fixa batch_id).
      Todas as linhas de teste (staging, canônicas, ingest_run) removidas após a prova.
      BUG REAL ENCONTRADO DEPOIS, AO TESTAR 2.17, E CORRIGIDO (migrations 014/015/016):
      conversion_event não tinha ON CONFLICT — reprocessar o mesmo batch DUPLICAVA o
      evento (violação de P-ING-1). Corrigido com uma coluna `source_event_id` (o
      identificador único do evento na origem, ex.: event_uuid do RD Station) + índice
      único parcial + ON CONFLICT real. Idempotência retestada e confirmada (count=1
      após rodar o mesmo batch duas vezes). Ver notas de 2.17.
      [AUTO-DECISION — ADR-015] carryForwardToPlan pedia "a mecânica de invocação da função
      SQL pelo n8n (nó, ordem, transação, tratamento de erro)". Decisão:
      UM nó Postgres "Execute Query" por execução de workflow, chamando
      SELECT * FROM fn_run_ingest_batch($batch_id) DEPOIS do insert em staging.
      Ordem: (1) n8n coleta da origem e conta; (2) n8n normaliza SÓ telefone para E.164;
      (3) insert em bloco no stg_* com batch_id; (4) uma chamada à procedure;
      (5) a procedure faz upsert ON CONFLICT (source_system, source_id) (P-ING-1),
      grava rows_source/rows_target e retorna a divergência; (6) o n8n grava o resultado.
      Transação: a procedure inteira é uma transação — all-or-nothing por lote. Em
      exceção, ela faz RAISE, o nó falha, e o ramo de erro do workflow grava
      ingest_run(status='failed', erro) — assim falha parcial fica VISÍVEL (NFR-1, EC-8)
      e o último dado válido permanece com sua idade real, jamais substituído por zero.
      Retry: retry-on-fail = 2 com backoff no nó; a idempotência vem do ON CONFLICT +
      batch_id, não da sorte.
      REJEITADO: chamar a função por linha em loop no n8n (N round trips, quebra P-ING-3,
      sem fronteira transacional) e transformar no nó Code (devolveria a regra de negócio
      para fora do controle de versão, revertendo a resolução de CRIT-4 e reabrindo R14).
      Nesta versão a procedure NÃO chama atribuição — fn_classify_origin só existe em
      phase-3. O wiring é 3.9, deliberadamente separado.
