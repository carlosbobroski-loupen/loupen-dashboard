- id: phase-5
  name: 'Fase 1d — Superfície (vanilla, uma view por vez)'
  description: >-
    Frontend HTML/CSS/JS vanilla no mesmo index.html, sem framework e sem build step
    (CON-12). A unidade de estrangulamento é A FONTE DE DADOS DE CADA VIEW, não a view
    em um app novo — derivação de §3.7 que o spec encaminhou ao @architect e que eu
    CONFIRMO aqui (ADR-018). Depende de phase-2 (dados), phase-3 (lógica e views SQL) e
    phase-4 (gate e /api/*). Verificação é browser/manual — não existe typecheck nem
    bundler neste projeto.
  subtasks:
  - id: '5.1'
    description: >-
      Criar os workflows n8n de LEITURA que servem /api/leads, /api/leads/{id},
      /api/jornada e /api/meta, consultando as views SQL de phase-3
    service: infra
    files:
    - 'n8n://workflow/crm-api-leads'
    - 'n8n://workflow/crm-api-lead-detalhe'
    - 'n8n://workflow/crm-api-meta'
    verification:
      type: manual
      instructions: >-
        Autenticado no Access, chamar cada recurso e confirmar: JSON com a classificação e
        a razão JÁ CALCULADAS pelo banco, timestamp de coleta por fonte, e contagens de
        reconciliação em /api/meta. Cada nó Webhook com Header auth e uma única
        Allowed Origin.
    status: partial
    notes: >-
      PARCIAL (2026-09-07) — `/api/leads` construído, ativado e TESTADO COM HTTP REAL
      (curl, não só a ferramenta de teste do n8n): sem header → 403; header errado → 403;
      header correto + `?segmento=Marketing` → JSON real e correto com leads+total. Workflow
      "CRM API - /api/leads" (n8n, id RNatAiKSjOuoWzjE) só chama fn_search_leads (3.19),
      sem lógica de negócio (CRIT-4 respeitado). Detalhes em edge-routing.md.
      `/api/leads/{id}` TAMBÉM construído e testado com HTTP real (workflow
      "CRM API - /api/leads/:id", id 6Rh3yYNX1gAwAIIh) — dois bugs reais encontrados e
      corrigidos: (1) dois ramos paralelos de Postgres alimentando o mesmo Code node
      misturam itens se referenciados por `$input` em vez de `$('NodeName')`; (2) Postgres
      com zero linhas não dispara os nodes seguintes por padrão, escondendo o caso
      "lead não encontrado" — corrigido com `alwaysOutputData`. Detalhes completos e o
      achado do webhookId prefixado (obrigatório para path dinâmico) em edge-routing.md.
      `/api/meta` TAMBÉM construído (workflow "CRM API - /api/meta", id
      na8l0jvaHqUon0I0) — os três recursos da subtask estão TODOS prontos, ativos e
      testados com HTTP real. ÚNICO ITEM NÃO SATISFEITO: a dependência '4.12'
      (Cloudflare Access) não existe ainda — os três endpoints têm só o Header Auth do
      n8n como proteção real, suficiente para dev, não para produção com dado de cliente
      real (registrado explicitamente em edge-routing.md).
      D5: o n8n também serve a leitura, continuação literal do padrão ADS_API_URL já em uso
      (index.html:1209) — evita construir camada de API nova na fase 1.
      Os workflows NÃO contêm lógica de negócio: chamam fn_search_leads (3.19),
      view_lead_360 (3.17), view_jornada_unificada (3.18) e as views de receita/cobertura.
      Qualquer regra escrita aqui reverte a resolução de CRIT-4 e reabre R14.
      /api/meta é o que alimenta NFR-4 e INT-6 na UI (idade do dado e divergência por fonte).
    dependencies: ['3.19', '3.17', '3.18', '3.14', '4.12']
    stage: B
