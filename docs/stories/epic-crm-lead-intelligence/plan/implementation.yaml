  name: Fase B.cutover — Troca do mock pelo backend real
  description: Fronteira entre Etapa A e Etapa B. So comeca depois que phase-2/phase-3/phase-4 (backend real, motor de atribuicao, gate) estiverem prontos E o usuario decidir avancar (CON-8). Subtasks de phase-5 marcadas stage:B (5.1, 5.12, 5.13, 5.14, 5.17, 5.18) executam junto desta fase, na ordem definida em dependencies — a numeracao delas ficou em phase-5 para nao renumerar o plano (convencao 6), mas a execucao real e aqui.
  subtasks:
  - id: '7.1'
    description: |
      Trocar a configuracao de assets/js/data-api.js do fixture mock (assets/data/mock/*.json) para os endpoints reais /api/leads, /api/leads/{id}, /api/jornada e /api/meta (5.1). Mudanca de UMA constante de origem de dados — nenhuma outra parte da interface muda, que e o ponto inteiro do contrato (D21). Se algo mais precisar mudar, o contrato de 0.1 tinha um furo — registrar como achado, nao como normal.
    service: frontend
    files:
    - assets/js/data-api.js
    verification:
      type: manual
      instructions: Confirmar visualmente que a superficie inteira (filtros, ficha, jornada, relacionados) continua funcionando identica, agora contra dado real, sem editar nenhum outro arquivo.
    status: partial
    notes: >-
      PARCIAL (2026-09-08) — código real ESCRITO, TESTADO DE PONTA A PONTA no meu ambiente
      local, mas NÃO PUBLICADO no site público ainda (dependência '4.12'/Cloudflare Access
      genuinamente não satisfeita — ver achado de segurança abaixo).
      ACHADO REAL DE SEGURANÇA (corrigindo uma simplificação minha anterior): um site
      estático não tem como esconder segredo do navegador. Colocar a chave de API do n8n
      direto no data-api.js exporia PII de todos os leads a qualquer visitante. Solução:
      `data-api.js` agora tem um modo real ativado SÓ por `window.__CRM_API_KEY__` — essa
      variável NUNCA é definida em nenhum arquivo commitado, só injetada manualmente em
      sessão de teste (Playwright `addInitScript`). Sem ela, o comportamento publicado
      continua idêntico ao fixture mock (confirmado: 39/39 testes node + 8/8 e2e Playwright
      continuam passando sem mudança).
      TESTADO COM DADO REAL, NAVEGADOR REAL, API REAL: lista de leads (14 reais), badge de
      segmento, KPIs, abertura de ficha (overview com razão auditável, jornada com 2
      eventos reais, related com conta+oportunidade+contrato calculado corretamente:
      R$1.200 MRR × 12 meses = R$14.400).
      QUATRO BUGS REAIS ENCONTRADOS E CORRIGIDOS testando com dado real (nenhum aparecia
      com o fixture mock, que sempre tinha campos completos): (1) leads.js quebrava com
      `data_criacao` nulo (`.slice` em null) — corrigido com fallback '—'; (2) mesmo para
      `estagio_funil` nulo; (3)/(4) nomes de campo diferentes entre a API real e o
      contrato da Etapa A (`stage_name`→`estagio`, `contrato_valor`→`valor_contrato`) —
      sem o mapeamento, a ficha mostrava "undefined" e "NaN" na tela.
      Dado de teste inserido e removido do banco depois da prova (mesmo padrão de toda a
      sessão).
    dependencies:
    - '5.1'
    - '4.12'
  - id: '7.2'
    description: |
      Rodar a MESMA suite de contrato (tests/contract/fixture-coverage.test.mjs e edge-cases-presentes.test.mjs de 0.3/0.4) contra o backend real, confirmando que a forma dos dados reais bate com o contrato de 0.1 — nao so que a UI nao quebrou.
