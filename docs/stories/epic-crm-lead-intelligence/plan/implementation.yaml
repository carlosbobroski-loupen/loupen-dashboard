      Escritos no mesmo formato dos ADRs 020/021 já existentes (Contexto / Decisão /
      Alternativas rejeitadas / Consequências / Ver também), e cada um traz as alternativas
      REJEITADAS COM O MOTIVO, como a nota exigia:
      ADR-015 (invocação SQL pelo n8n) — rejeitados: chamada por linha em loop (N round
      trips, quebra P-ING-3, sem fronteira transacional do lote) e transformação no nó Code
      (devolveria a regra de negócio para fora do controle de versão, reabrindo R14).
      ADR-016 (versionamento de reclassificação) — rejeitados: coluna de versão simples
      (perde o de-para, que é justamente a pergunta que originou o épico) e tabela de log
      lateral (pode divergir da canônica porque nada no banco força os dois a andarem
      juntos — log em que não se confia é pior que nenhum).
      ADR-017 (runners de teste) — rejeitados: Jest/Vitest (exigem package.json na raiz +
      node_modules para testar JS que roda sem nenhum dos dois, e trazem transform/config,
      o começo de um build step) e harness caseiro em página HTML (sem exit code, logo
      inautomatizável; exigiria humano olhando a tela). Também rejeitado "um runner só para
      tudo": forçaria instalar toolchain para testar SQL ou testar navegador sem navegador.
      ADR-015 e ADR-017 ganharam seção "Atualização de 2026-09-09" com o que a
      implementação real mudou/revelou, em vez de fingir que a decisão original previu
      tudo: em 015, que `sync_state` não era escrito por ninguém (a própria exceção que a
